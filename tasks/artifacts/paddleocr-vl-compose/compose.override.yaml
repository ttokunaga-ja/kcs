# Overrides the stock compose only where a 12 GB card forces it.
#
# The upstream VLM command is
#   paddleocr genai_server --model_name PaddleOCR-VL-1.6-0.9B --host 0.0.0.0 \
#     --port 8080 --backend ${BACKEND}
# which takes the model's built-in vLLM defaults. Those defaults are sized for a
# datacenter GPU, so the engine dies on this card before serving anything. This
# adds --backend_config to resize, and changes nothing else.
#
# shm_size is dropped from 64g to 8g: Docker Desktop's WSL2 VM does not have
# 64 GB to back a tmpfs, and this pipeline does not need it.
services:
  paddleocr-vlm-server:
    shm_size: 8g
    volumes:
      - ./backend-config.yaml:/cfg/backend-config.yaml:ro
    command: >
      /bin/bash -c "paddleocr genai_server
      --model_name PaddleOCR-VL-1.6-0.9B
      --host 0.0.0.0 --port 8080
      --backend vllm
      --backend_config /cfg/backend-config.yaml"

  paddleocr-vl-api:
    shm_size: 8g
