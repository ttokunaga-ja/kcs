# Resource sizing only, for a 12 GB RTX 4070. The shipped defaults
# (gpu-memory-utilization 0.5, max-num-batched-tokens 131072) assume a
# datacenter card: on 12 GB they leave "Available KV cache memory: -0.18 GiB"
# and the engine refuses to start.
#
# Nothing here changes what the model computes -- no sampling, no template, no
# weights. Keys become vLLM CLI args (underscores -> dashes).
trust_remote_code: true
gpu_memory_utilization: 0.85
max_model_len: 16384
# 131072 sizes the chunked-prefill activation buffer far past what a 12 GB card
# can hold alongside weights + KV cache. 16384 matches max_model_len, so a full
# context still prefills in one chunk.
max_num_batched_tokens: 16384
# One frontend process instead of 4: fewer host processes, same engine.
api_server_count: 1
