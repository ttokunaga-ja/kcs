[package]
name = "kio-eval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kio-eval"
path = "src/main.rs"

[dependencies]
base64.workspace = true
cap-primitives.workspace = true
clap.workspace = true
getrandom.workspace = true
kio-core.workspace = true
kio-index.workspace = true
kio-pipeline.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
toml.workspace = true
rusqlite.workspace = true
tempfile = "3"
thiserror.workspace = true
unicode-normalization.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
