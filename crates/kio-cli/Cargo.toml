[package]
name = "kio-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[[bin]]
name = "kio"
path = "src/main.rs"

[features]
# 日本語の語レーン。既定 off の理由はワークスペースの Cargo.toml を参照。
# 索引側と query 側は同じ分割でなければ何も引けないので、片方だけを有効に
# できないよう kio-index の同名 feature へ素通しにする。
word-lane = ["kio-index/word-lane"]

[dependencies]
cap-primitives = "3.4.5"
clap.workspace = true
getrandom.workspace = true
kio-adapter = { path = "../kio-adapter" }
kio-core.workspace = true
kio-index = { path = "../kio-index" }
kio-pipeline = { path = "../kio-pipeline" }
kio-search = { path = "../kio-search" }
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-normalization.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
assert_cmd = "2"
# ct3_multi_011 asserts on the device replica through its own public API,
# rather than pinning the rule to a hand-tuned BM25 ranking.
kio-index = { path = "../kio-index" }
base64.workspace = true
# step4b_flate_contract.rs compresses its PDF fixtures at test time so the
# FlateDecode extraction path is exercised against real zlib streams.
miniz_oxide.workspace = true
serde_jcs.workspace = true
tempfile = "3"
