[package]
name = "kio-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
kio-core = { path = "../kio-core" }
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
miniz_oxide.workspace = true
# Batch upload multipart boundaries (07 §5.5): OS-entropy boundary strings so
# a boundary can never be predicted from (or collide with) the payload.
getrandom.workspace = true
# Authenticated adapter responses use identity encoding so wire and decoded
# byte ceilings cannot be bypassed through transparent decompression.
ureq.workspace = true
# XLSX sheet extraction (07 §5.1): OOXML is namespaced XML with entity escaping
# and attribute-order-independent structure — the class of parsing where a
# hand-rolled reader fails SILENTLY, producing plausible wrong text rather than
# an error. Pure Rust, no default features, no transitive deps. The ZIP
# container around it is read in-crate instead: its failure mode is a loud
# refusal, and the decompression bounds are ours to set (`xlsx_extract`).
quick-xml = { version = "0.41", default-features = false }

[dev-dependencies]
tempfile = "3"
