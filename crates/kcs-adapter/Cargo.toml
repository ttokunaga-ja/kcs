[package]
name = "kcs-adapter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
miniz_oxide.workspace = true
# Batch upload multipart boundaries (07 §5.7): OS-entropy boundary strings so
# a boundary can never be predicted from (or collide with) the payload.
getrandom.workspace = true
# Authenticated adapter responses use identity encoding so wire and decoded
# byte ceilings cannot be bypassed through transparent decompression.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
