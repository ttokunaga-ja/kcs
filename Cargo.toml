[workspace]
members = [
    "crates/kcs-adapter",
    "crates/kcs-cli",
    "crates/kcs-core",
    "crates/kcs-index",
    "crates/kcs-pipeline",
    "crates/kcs-search",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license-file = "LICENSE"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
kcs-core = { path = "crates/kcs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
jsonschema = { version = "0.26", default-features = false }
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
unicode-normalization = "0.1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
