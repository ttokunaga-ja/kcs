[workspace]
members = [
    "crates/kcs-adapter",
    "crates/kcs-cli",
    "crates/kcs-core",
    "crates/kcs-index",
    "crates/kcs-pipeline",
    "crates/kcs-search",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
license-file = "LICENSE"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
kcs-core = { path = "crates/kcs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
jsonschema = { version = "0.26", default-features = false }
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
unicode-normalization = "0.1"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
# Pinned to the stable 0.1.6: the 0.1.7+ alpha releases ship a broken build
# (`sqlite-vec.c` #includes `sqlite-vec-diskann.c`, which is not packaged in the
# crate, so cc-rs fails). 0.1.6 compiles cleanly against bundled rusqlite 0.32
# and provides the `vec0` module used by `chunk_vec` (04 §4.3).
sqlite-vec = "=0.1.6"
