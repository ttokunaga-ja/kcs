[workspace]
members = [
    "crates/kcs-cli",
    "crates/kcs-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license-file = "LICENSE"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
kcs-core = { path = "crates/kcs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
