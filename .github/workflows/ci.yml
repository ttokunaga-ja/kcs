name: CI

on:
  push:
  pull_request:

jobs:
  persona-v2-nonauthorizing-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_contract
          eval.test_persona_v2_topology
          eval.test_persona_v2_joint_problem
          eval.test_persona_v2_joint_solver_policy
          eval.test_persona_v2_artifact_common
          eval.test_persona_v2_realism_profile
          eval.test_persona_v2_variant_catalog
          eval.test_persona_v2_route_affinity
          eval.test_persona_v2_fact_graph
          eval.test_persona_v2_text_renderer_validator
          eval.test_persona_v2_pdf_text_renderer_validator
          eval.test_persona_v2_incidental_text_renderer_validator
          eval.test_persona_v2_raw_document_renderer_validator
          eval.test_persona_v2_raw_image_media_renderer_validator
          eval.test_persona_v2_raw_zip_renderer_validator
          eval.test_persona_v2_raw_tar_gzip_renderer_validator
          eval.test_persona_v2_raw_domain_renderer_validator
          eval.test_persona_v2_format_implementation_registry
          eval.test_persona_v2_formal_source_recipe_catalog
          eval.test_persona_v2_aggregate_byte_distribution_catalog
          eval.test_persona_v2_overlay_compatible_byte_distribution
          eval.test_persona_v2_primary_use_case_catalog
          eval.test_persona_v2_chunk_accounting
          eval.test_persona_v2_source_profile_catalog
          eval.test_persona_v2_overlay_contract

  persona-v2-nonauthorizing-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_bounded_body
          eval.test_persona_v2_bounded_jsonl
          eval.test_persona_v2_route_review_receipt
          eval.test_persona_v2_source_inventory_layout
          eval.test_persona_v2_overlay_reservation_layout
          eval.test_persona_v2_source_intent
          eval.test_persona_v2_fact_membership
          eval.test_persona_v2_history_intent
          eval.test_persona_v2_query_intent
          eval.test_persona_v2_semantic_oracle
          eval.test_persona_v2_input_closure
          eval.test_persona_v2_input_closure_live
          eval.test_persona_v2_lifecycle_demand
          eval.test_persona_v2_recursive_robustness_lane_catalog
          eval.test_persona_v2_scale_invariants

  persona-v2-source-inventory-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_source_inventory_profile
          eval.test_persona_v2_source_inventory_package

  persona-v2-source-semantic-membership-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_source_semantic_membership_package

  persona-v2-lifecycle-coverage-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_lifecycle_coverage_catalog

  persona-v2-concrete-overlay-membership-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_concrete_overlay_membership_package

  persona-v2-source-parameter-assignment-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_source_parameter_assignment_package

  persona-v2-source-matched-lifecycle-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_source_matched_lifecycle_inventory

  persona-v2-lifecycle-effective-membership-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_lifecycle_effective_membership_reconciliation

  persona-v2-semantic-projection-derivation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_derivation_inventory.SemanticProjectionDerivationInventoryContractTest

  persona-v2-semantic-projection-derivation-full:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_derivation_inventory.SemanticProjectionDerivationInventoryLongAll113Test

  persona-v2-semantic-projection-derivation-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_derivation_inventory.SemanticProjectionDerivationInventoryLongColdHashSeedTest

  persona-v2-semantic-projection-complete-content:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_global_content
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_corpus_content
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_relations_parameters
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_payload_equivalence_rule_catalog

  persona-v2-semantic-projection-complete-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_complete_inventory.SemanticProjectionCompleteInventoryContractTest

  persona-v2-semantic-projection-complete-full:
    needs:
      - persona-v2-semantic-projection-complete-content
      - persona-v2-semantic-projection-complete-contract
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_complete_inventory.SemanticProjectionCompleteInventoryLongAll253Test

  persona-v2-semantic-projection-complete-cold:
    needs:
      - persona-v2-semantic-projection-complete-content
      - persona-v2-semantic-projection-complete-contract
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_semantic_projection_complete_inventory.SemanticProjectionCompleteInventoryLongColdHashSeedTest

  persona-v2-closure-contract-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_corpus_semantic_namespace_v3.CorpusSemanticNamespaceV3FastContractTest
          eval.test_persona_v2_corpus_semantic_namespace_v3.CorpusSemanticNamespaceV3FastBoundaryTest
          eval.test_persona_v2_review_request_catalog.PersonaV2ReviewRequestCatalogContractTests
          eval.test_persona_v2_g0_blocker_resolution_ledger.PersonaV2G0BlockerResolutionLedgerTests
          eval.test_persona_v2_query_history_target_resolution.PersonaV2QueryHistoryTargetResolutionTests
          eval.test_persona_v2_device_lane_compositor.PersonaV2DeviceLaneCompositorTests
          eval.test_persona_v2_query_history_semantic_resolution_feasibility.SemanticResolutionFeasibilityFastTests
          eval.test_persona_v2_corpus_input_closure_v3.CorpusInputClosureV3FastTests
          eval.test_persona_v2_evaluation_target_resolution_closure_slice.PersonaV2EvaluationTargetResolutionClosureSliceTests
          eval.test_persona_v2_history_presolve_input_closure_slice.PersonaV2HistoryPresolveInputClosureSliceTests
          eval.test_persona_v2_history_readiness_contract.PersonaV2HistoryReadinessContractTests
          eval.test_persona_v2_source_semantic_capacity_axis_catalog.PersonaV2SourceSemanticCapacityAxisCatalogTests
          eval.test_persona_v2_capacity_fact_truth_occurrence_policy.PersonaV2CapacityFactTruthOccurrencePolicyTests

  persona-v2-source-semantic-capacity-axis-full:
    needs: persona-v2-closure-contract-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_SOURCE_SEMANTIC_CAPACITY_AXIS_FULL=1
          python3 -m unittest -v
          eval.test_persona_v2_source_semantic_capacity_axis_catalog.PersonaV2SourceSemanticCapacityAxisCatalogFullTest

  persona-v2-source-semantic-capacity-axis-cold:
    needs: persona-v2-closure-contract-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_SOURCE_SEMANTIC_CAPACITY_AXIS_COLD=1
          python3 -m unittest -v
          eval.test_persona_v2_source_semantic_capacity_axis_catalog.PersonaV2SourceSemanticCapacityAxisCatalogColdTest

  persona-v2-capacity-fact-truth-occurrence-policy-full:
    needs: persona-v2-closure-contract-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_CAPACITY_FACT_TRUTH_OCCURRENCE_POLICY_FULL=1
          python3 -m unittest -v
          eval.test_persona_v2_capacity_fact_truth_occurrence_policy.PersonaV2CapacityFactTruthOccurrencePolicyFullTest

  persona-v2-capacity-fact-truth-occurrence-policy-cold:
    needs: persona-v2-closure-contract-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_CAPACITY_FACT_TRUTH_OCCURRENCE_POLICY_COLD=1
          python3 -m unittest -v
          eval.test_persona_v2_capacity_fact_truth_occurrence_policy.PersonaV2CapacityFactTruthOccurrencePolicyColdTest

  persona-v2-history-presolve-input-closure-full:
    needs: persona-v2-closure-contract-fast
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_HISTORY_PRESOLVE_CLOSURE_SLICE_FULL=1
          python3 -m unittest -v
          eval.test_persona_v2_history_presolve_input_closure_slice.PersonaV2HistoryPresolveInputClosureSliceFullTest

  persona-v2-history-presolve-input-closure-cold:
    needs: persona-v2-closure-contract-fast
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_HISTORY_PRESOLVE_CLOSURE_SLICE_COLD=1
          python3 -m unittest -v
          eval.test_persona_v2_history_presolve_input_closure_slice.PersonaV2HistoryPresolveInputClosureSliceColdTest

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: >-
          python3 -m unittest
          eval.test_eval_env
          eval.test_persona_fixture
          eval.test_persona_person_plan
          eval.test_persona_full_scale_limits
          eval.test_persona_allocation
          eval.test_persona_history_allocation
          eval.test_persona_structural_allocation
          eval.test_persona_event_manifest
          eval.test_persona_suite_event_manifest
          eval.test_persona_suite_event_streaming
          eval.test_persona_capacity
          eval.test_persona_storage
          eval.test_persona_streaming_storage
          eval.test_persona_root_lock
          eval.test_persona_kio_runner
          eval.test_persona_prepare_receipt
          eval.test_persona_history_attestation
          eval.test_persona_renderers
          eval.test_persona_manifest
          eval.test_generate_persona_corpus
          eval.test_run_eval
          eval.test_scale_corpus
          eval.test_scale_attest_bounds
          eval.test_scale_prepare
          eval.test_run_scale_eval

  persona-w0-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KIO_RUN_PERSONA_FS_INTEGRATION=1
          python3 -m unittest -v
          eval.test_generate_persona_corpus

  synthetic-history-eval:
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: python3 eval/generate_scale_corpus.py --out /tmp/kio-scale-tiny --profile tiny
      - run: python3 eval/prepare_scale_corpus.py --corpus /tmp/kio-scale-tiny --bin target/release/kio
      - run: python3 eval/attest_scale_corpus.py --corpus /tmp/kio-scale-tiny
      - run: python3 eval/generate_corpus.py --out /tmp/kio-eval-corpus
      - run: python3 eval/replay_history.py --corpus /tmp/kio-eval-corpus --bin target/release/kio
      - run: python3 eval/run_eval.py --scenario M3-1 --corpus /tmp/kio-eval-corpus --bin target/release/kio
      - run: python3 eval/run_eval.py --scenario M3-2 --corpus /tmp/kio-eval-corpus --bin target/release/kio
      - run: python3 eval/run_eval.py --scenario M3-3 --corpus /tmp/kio-eval-corpus --bin target/release/kio

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - run: cargo check --workspace --all-targets --locked

  macos-security-r23:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
      - run: >-
          python3 -m unittest
          eval.test_persona_root_lock
          eval.test_persona_prepare_receipt
          eval.test_persona_history_attestation

  windows-security-r23:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
