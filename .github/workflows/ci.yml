name: CI

on:
  push:
  pull_request:

jobs:
  persona-v2-nonauthorizing-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_contract
          eval.test_persona_v2_topology
          eval.test_persona_v2_joint_problem
          eval.test_persona_v2_joint_solver_policy
          eval.test_persona_v2_artifact_common
          eval.test_persona_v2_realism_profile
          eval.test_persona_v2_variant_catalog
          eval.test_persona_v2_route_affinity
          eval.test_persona_v2_fact_graph
          eval.test_persona_v2_text_renderer_validator
          eval.test_persona_v2_pdf_text_renderer_validator
          eval.test_persona_v2_incidental_text_renderer_validator
          eval.test_persona_v2_source_profile_catalog
          eval.test_persona_v2_overlay_contract

  persona-v2-nonauthorizing-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_bounded_body
          eval.test_persona_v2_bounded_jsonl
          eval.test_persona_v2_route_review_receipt
          eval.test_persona_v2_source_inventory_layout
          eval.test_persona_v2_overlay_reservation_layout
          eval.test_persona_v2_source_intent
          eval.test_persona_v2_fact_membership
          eval.test_persona_v2_history_intent
          eval.test_persona_v2_query_intent
          eval.test_persona_v2_semantic_oracle
          eval.test_persona_v2_input_closure
          eval.test_persona_v2_input_closure_live
          eval.test_persona_v2_scale_invariants

  persona-v2-source-inventory-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_source_inventory_profile
          eval.test_persona_v2_source_inventory_package

  persona-v2-source-semantic-membership-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_source_semantic_membership_package

  persona-v2-concrete-overlay-membership-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 -m unittest -v
          eval.test_persona_v2_concrete_overlay_membership_package

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: >-
          python3 -m unittest
          eval.test_eval_env
          eval.test_persona_fixture
          eval.test_persona_person_plan
          eval.test_persona_full_scale_limits
          eval.test_persona_allocation
          eval.test_persona_history_allocation
          eval.test_persona_structural_allocation
          eval.test_persona_event_manifest
          eval.test_persona_suite_event_manifest
          eval.test_persona_suite_event_streaming
          eval.test_persona_capacity
          eval.test_persona_storage
          eval.test_persona_streaming_storage
          eval.test_persona_root_lock
          eval.test_persona_kcs_runner
          eval.test_persona_prepare_receipt
          eval.test_persona_history_attestation
          eval.test_persona_renderers
          eval.test_persona_manifest
          eval.test_generate_persona_corpus
          eval.test_run_eval
          eval.test_scale_corpus
          eval.test_scale_attest_bounds
          eval.test_scale_prepare
          eval.test_run_scale_eval

  persona-w0-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_PERSONA_FS_INTEGRATION=1
          python3 -m unittest -v
          eval.test_generate_persona_corpus

  synthetic-history-eval:
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: python3 eval/generate_scale_corpus.py --out /tmp/kcs-scale-tiny --profile tiny
      - run: python3 eval/prepare_scale_corpus.py --corpus /tmp/kcs-scale-tiny --bin target/release/kcs
      - run: python3 eval/attest_scale_corpus.py --corpus /tmp/kcs-scale-tiny
      - run: python3 eval/generate_corpus.py --out /tmp/kcs-eval-corpus
      - run: python3 eval/replay_history.py --corpus /tmp/kcs-eval-corpus --bin target/release/kcs
      - run: python3 eval/run_eval.py --scenario M3-1 --corpus /tmp/kcs-eval-corpus --bin target/release/kcs
      - run: python3 eval/run_eval.py --scenario M3-2 --corpus /tmp/kcs-eval-corpus --bin target/release/kcs
      - run: python3 eval/run_eval.py --scenario M3-3 --corpus /tmp/kcs-eval-corpus --bin target/release/kcs

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - run: cargo check --workspace --all-targets --locked

  macos-security-r23:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
      - run: >-
          python3 -m unittest
          eval.test_persona_root_lock
          eval.test_persona_prepare_receipt
          eval.test_persona_history_attestation

  windows-security-r23:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
