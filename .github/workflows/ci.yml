name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: >-
          python3 -m unittest
          eval.test_eval_env
          eval.test_persona_fixture
          eval.test_persona_person_plan
          eval.test_persona_full_scale_limits
          eval.test_persona_allocation
          eval.test_persona_history_allocation
          eval.test_persona_structural_allocation
          eval.test_persona_event_manifest
          eval.test_persona_suite_event_manifest
          eval.test_persona_suite_event_streaming
          eval.test_persona_capacity
          eval.test_persona_storage
          eval.test_persona_streaming_storage
          eval.test_persona_root_lock
          eval.test_persona_kcs_runner
          eval.test_persona_history_attestation
          eval.test_persona_renderers
          eval.test_persona_manifest
          eval.test_generate_persona_corpus
          eval.test_run_eval
          eval.test_scale_corpus
          eval.test_scale_attest_bounds
          eval.test_scale_prepare
          eval.test_run_scale_eval

  persona-w0-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: >-
          KCS_RUN_PERSONA_FS_INTEGRATION=1
          python3 -m unittest -v
          eval.test_generate_persona_corpus

  synthetic-history-eval:
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: python3 eval/generate_scale_corpus.py --out /tmp/kcs-scale-tiny --profile tiny
      - run: python3 eval/prepare_scale_corpus.py --corpus /tmp/kcs-scale-tiny --bin target/release/kcs
      - run: python3 eval/attest_scale_corpus.py --corpus /tmp/kcs-scale-tiny
      - run: python3 eval/generate_corpus.py --out /tmp/kcs-eval-corpus
      - run: python3 eval/replay_history.py --corpus /tmp/kcs-eval-corpus --bin target/release/kcs
      - run: python3 eval/run_eval.py --scenario M3-1 --corpus /tmp/kcs-eval-corpus --bin target/release/kcs
      - run: python3 eval/run_eval.py --scenario M3-2 --corpus /tmp/kcs-eval-corpus --bin target/release/kcs
      - run: python3 eval/run_eval.py --scenario M3-3 --corpus /tmp/kcs-eval-corpus --bin target/release/kcs

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - run: cargo check --workspace --all-targets --locked

  macos-security-r23:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked

  windows-security-r23:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
