name: CI

on:
  push:
  pull_request:

# Keep only product-connected gates on every push and pull request. Retired
# non-authorizing design experiments remain recoverable from Git history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All jobs only checkout and validate repository contents. Add narrower
# job-level permissions if a future step needs write access.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # This directly exercises the Rust-owned persona plan, renderer, manifest,
      # and schedule contracts alongside their public CLI/binary targets.
      - run: cargo test --workspace --all-targets --locked
      - run: >-
          python3 -m unittest
          eval.test_build_macos_comparator_runtime
          eval.test_eval_env
          eval.test_u7_same_space

  persona-w0-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build -p kio-eval --bin kio-eval --locked
      - run: >-
          target/debug/kio-eval persona plan --profile tiny
          --out /tmp/kio-persona-plan.json
      - run: >-
          target/debug/kio-eval persona schedule
          --plan /tmp/kio-persona-plan.json
          --out /tmp/kio-persona-schedule.json
      - run: >-
          target/debug/kio-eval persona render
          --plan /tmp/kio-persona-plan.json
          --out /tmp/kio-persona-render.json
      - run: >-
          target/debug/kio-eval persona materialize
          --plan /tmp/kio-persona-plan.json
          --schedule /tmp/kio-persona-schedule.json
          --render /tmp/kio-persona-render.json
          --destination /tmp/kio-persona-artifacts
          --replay-id replay-01
      - name: Refuse a second materialization without mutating the first
        run: |
          sha256sum \
            /tmp/kio-persona-artifacts/persona-plan.json \
            /tmp/kio-persona-artifacts/persona-schedule.json \
            /tmp/kio-persona-artifacts/persona-render.json \
            /tmp/kio-persona-artifacts/persona-materialization.json \
            > /tmp/kio-persona-materialization.before
          if target/debug/kio-eval persona materialize \
            --plan /tmp/kio-persona-plan.json \
            --schedule /tmp/kio-persona-schedule.json \
            --render /tmp/kio-persona-render.json \
            --destination /tmp/kio-persona-artifacts \
            --replay-id replay-01; then
            echo "second create-only materialization unexpectedly succeeded" >&2
            exit 1
          fi
          sha256sum --check /tmp/kio-persona-materialization.before
      - run: >-
          target/debug/kio-eval persona scaffold
          --plan /tmp/kio-persona-plan.json
          --root /tmp/kio-persona-workspaces
      - name: Coordinate the Rust workspace through Rust leases
        run: |
          target/debug/kio-eval persona lease claim \
            --root /tmp/kio-persona-workspaces \
            --persona p01 --session ci-parent --label ci \
            > /tmp/kio-persona-parent-lease.json
          target/debug/kio-eval persona lease scope claim \
            --root /tmp/kio-persona-workspaces \
            --persona p01 --scope-id p01-primary-01 \
            --parent-session ci-parent --worker-session ci-worker --label ci \
            > /tmp/kio-persona-scope-lease.json
          target/debug/kio-eval persona lease scope release \
            --root /tmp/kio-persona-workspaces \
            --persona p01 --scope-id p01-primary-01 \
            --parent-session ci-parent \
            --release-token "$(jq -er .release_token /tmp/kio-persona-scope-lease.json)" \
            > /tmp/kio-persona-scope-release.json
          target/debug/kio-eval persona lease release \
            --root /tmp/kio-persona-workspaces \
            --persona p01 \
            --release-token "$(jq -er .release_token /tmp/kio-persona-parent-lease.json)" \
            > /tmp/kio-persona-parent-release.json
      - name: Attest the Rust materialization through the Rust boundary
        run: |
          target/debug/kio-eval persona attest \
            --root /tmp/kio-persona-artifacts \
            --out /tmp/kio-persona-filesystem-attestation.json
          jq -e '
            .schema == "kio.persona.filesystem-attestation/v1" and
            .claims == {"actual_kio_evidence":false,"history_ready":false}
          ' /tmp/kio-persona-filesystem-attestation.json

  synthetic-history-eval:
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      # Optional ranking features must take this same eval path; `--all-features`
      # prevents a default-off ranking lane from bypassing the only Recall gate.
      - run: >-
          cargo build --release --locked --all-features
          -p kio-cli -p kio-eval --bins
      # This lane has no fixture/product network dependency. The Rust v2
      # commands create an isolated device under the temporary corpus.
      - run: >-
          target/release/kio-eval scale generate
          --out /tmp/kio-scale-tiny --profile tiny
      - run: >-
          target/release/kio-eval scale prepare
          --corpus /tmp/kio-scale-tiny --bin target/release/kio
      - run: >-
          target/release/kio-eval scale attest
          --corpus /tmp/kio-scale-tiny
      # This is a contract smoke only: tiny fixtures are deliberately not
      # performance-acceptance eligible.
      - run: >-
          target/release/kio-eval scale benchmark
          --corpus /tmp/kio-scale-tiny --bin target/release/kio
          --warmups 1 --samples 1 --out /tmp/kio-scale-tiny-rust-smoke.json
      - run: target/release/kio-eval generate-corpus --out /tmp/kio-eval-corpus
      # replay-history rejects hardlinked executables at its trust boundary.
      - run: install -m 0755 target/release/kio /tmp/kio-replay-kio
      - run: >-
          target/release/kio-eval replay-history
          --corpus /tmp/kio-eval-corpus --bin /tmp/kio-replay-kio
      - run: >-
          target/release/kio-eval crossscope --dry-run
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
          --out /tmp/kio-crossscope-unused.json
      - run: >-
          target/release/kio-eval crossscope
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
          --out /tmp/kio-crossscope-results.json
      - run: >-
          target/release/kio-eval rerank-dump
          --golden eval/golden-queries-short.jsonl
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
          --limit 10 --out /tmp/kio-rerank-input.json
      - run: gzip -dc eval/rerank/rerank-input-fixture.json.gz > /tmp/kio-rerank-fixture-input.json
      - run: gzip -dc eval/rerank/rerank-output-bge-reranker-v2-m3.json.gz > /tmp/kio-rerank-fixture-output.json
      - run: >-
          target/release/kio-eval rerank-apply
          --input /tmp/kio-rerank-fixture-input.json
          --output /tmp/kio-rerank-fixture-output.json
          --report /tmp/kio-rerank-fixture-report.json
      - run: target/release/kio-eval --scenario M3-1 --corpus /tmp/kio-eval-corpus --bin target/release/kio
      # The short-query corpus has a measured 22/24 baseline. Unlike the saturated
      # 50-query set, this gate has room to detect both improvements and regressions.
      - run: >-
          target/release/kio-eval --golden eval/golden-queries-short.jsonl
          --scenario M3-1 --min-recall 0.9166666666666666
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
      - run: target/release/kio-eval --scenario M3-2 --corpus /tmp/kio-eval-corpus --bin target/release/kio
      - run: target/release/kio-eval --scenario M3-3 --corpus /tmp/kio-eval-corpus --bin target/release/kio

  macos-security-r23:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo test --workspace --all-targets --locked

  windows-security-r23:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo test --workspace --all-targets --locked
